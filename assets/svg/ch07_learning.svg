<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" role="img" aria-labelledby="t d"><title id="t">학습 및 추론 구조</title><desc id="d">속도 데이터에서 정답 거리와 예측 거리를 비교하고 오차를 역전파하여 가중치를 갱신하는 구조</desc><rect width="940" height="260" rx="16" fill="#f6f9fc"/><g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="25" y="70" width="155" height="75" rx="10" fill="#d9eafb" stroke="#3074ad"/><text x="102" y="100">speed</text><text x="102" y="123">입력 속도</text><rect x="230" y="70" width="175" height="75" rx="10" fill="#e3f4e5" stroke="#32824a"/><text x="317" y="100">model(speed)</text><text x="317" y="123">거리 예측</text><rect x="460" y="70" width="175" height="75" rx="10" fill="#fff0d7" stroke="#b97c1b"/><text x="548" y="100">MSELoss</text><text x="548" y="123">정답과 오차 비교</text><rect x="695" y="70" width="220" height="75" rx="10" fill="#f5e7fa" stroke="#9359aa"/><text x="805" y="100">backward + step</text><text x="805" y="123">기울기·가중치 갱신</text><g stroke="#375a76" stroke-width="3" fill="none"><path d="M180 108H230"/><path d="M405 108H460"/><path d="M635 108H695"/><path d="M805 145V210H317V145" stroke-dasharray="8 5"/></g><g fill="#375a76"><path d="M224 102l8 6-8 6z"/><path d="M454 102l8 6-8 6z"/><path d="M689 102l8 6-8 6z"/></g><text x="560" y="201" font-size="14" fill="#4d5260">학습 시 반복 · 추론 시에는 갱신하지 않음</text></g></svg>
