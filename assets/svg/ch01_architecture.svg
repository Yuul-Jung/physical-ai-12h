<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="카메라·라이다 입력에서 인식, 판단, 안전 게이트, 모터 구동까지 이어지는 흐름"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker></defs><rect width="960" height="260" rx="18" fill="#f5f8fd"/><g font-family="sans-serif" text-anchor="middle"><rect x="24" y="67" width="150" height="102" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="99" y="103" font-size="19">센서 입력</text><text x="99" y="131" font-size="14">카메라 · 라이다</text><rect x="212" y="67" width="150" height="102" rx="12" fill="#dcfce7" stroke="#4ade80"/><text x="287" y="103" font-size="19">인식</text><text x="287" y="131" font-size="14">영상 · 거리 해석</text><rect x="400" y="67" width="150" height="102" rx="12" fill="#fef9c3" stroke="#facc15"/><text x="475" y="103" font-size="19">판단</text><text x="475" y="131" font-size="14">속도 · 방향 결정</text><rect x="588" y="67" width="150" height="102" rx="12" fill="#fee2e2" stroke="#f87171"/><text x="663" y="103" font-size="19">안전 게이트</text><text x="663" y="131" font-size="14">조건 검증</text><rect x="776" y="67" width="160" height="102" rx="12" fill="#e9d5ff" stroke="#c084fc"/><text x="856" y="103" font-size="19">구동 제어</text><text x="856" y="131" font-size="14">조향 · 후륜 모터</text><text x="480" y="30" font-size="19" font-weight="bold">피지컬 AI의 인식 → 판단 → 제어 흐름</text><text x="480" y="221" font-size="14" fill="#334155">본 차시는 구조·안전 논리만 다룸. 실제 모터 제어는 2차시에서 제조사 API 검증 후 수행.</text></g><g stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"><path d="M174 118 H209"/><path d="M362 118 H397"/><path d="M550 118 H585"/><path d="M738 118 H773"/></g></svg>